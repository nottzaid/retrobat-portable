[package]
name = "retrobat-portable"
version = "0.1.11"
edition = "2024"
rust-version = "1.92"
description = "A verified, portable catalog and launcher for RetroBat"
license = "MIT"

[dependencies]
dirs = "6.0"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }
libc = "0.2"
md5 = "0.7"
percent-encoding = "2"
quick-xml = "0.39"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
